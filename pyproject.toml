[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polygon-tool"
version = "1.0.0"
description = "Perimeter and area of a polygon from vertex coordinates; backup and restore of coordinate points"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
polygon-tool = "polygon_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
